  Hi, I’m **Franziska** — a trained computer scientist and self-taught illustrator.

  I enjoy moving between two worlds: the structured logic of software development and the free, tactile process of drawing by hand.

  Here I share what I’m working on and what moves me.

  #### IT-Skills
  Python · Java · Machine Learning · Computer Vision · Web Development · Git · Linux

  #### Art-Skills
  Traditional Drawing & Painting · Floral Pattern Design

