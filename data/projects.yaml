- title: "KanjiReader: Mobile App for Automatic Japanese Text Recognition and Translation"  
  summary: >
    Team project: Development of a mobile application for the automated 
    recognition and translation of Japanese text in images using React Native 
    and Expo. The app can also automatically add furigana to Japanese text. 
    I was responsible for implementing the OCR functionality for detecting and 
    extracting Japanese text from images.
  image: "/images/projects/kanjireader.png"
  tags:
    - app development
    - react native
    - expo
    - japanese
  links:
    - label: "GitHub"
      url: "https://github.com/franziska-kaschek/kanjireader-app"