{{ $section := .Section }}
{{ $config := .Config }}
{{ $items := .Data }}

<section id="{{ $section }}" class="illustrations-section section-block">

  <div class="section-heading">
    <span class="bar"></span>
    <div>
      <h2>{{ default "Illustrations" $config.title }}</h2>
    </div>
  </div>

<div class="illustrations-grid">

  {{ range $index, $item := $items }}

    <button
      type="button"
      class="illustration-card {{ if ge $index 4 }}illustration-hidden{{ end }}"
      data-image="{{ $item.image | relURL }}"
      data-title="{{ $item.title }}"
      aria-label="View {{ $item.title }} larger"
    >
      <img
        src="{{ $item.image | relURL }}"
        alt="{{ $item.title }}"
        loading="lazy"
      >
    </button>

  {{ end }}

</div>

{{ if gt (len $items) 4 }}
  <button
    type="button"
    class="illustrations-toggle"
    id="illustrations-toggle"
  >
    Show more
  </button>
{{ end }}

</section>

<div
  id="illustration-lightbox"
  class="illustration-lightbox"
  aria-hidden="true"
>
  <button
    type="button"
    class="lightbox-close"
    aria-label="Close image"
  >
    ×
  </button>

  <img
    id="lightbox-image"
    src=""
    alt=""
  >

  <p id="lightbox-title"></p>
</div>
